<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="LoginPallete.css">
    <script src="pallete.js"></script>
    <title>Bem Vindo</title>
</head>
<body>
    <section id="AnimaçãoLogin">
        <div id="svgInterativo">

            <svg viewBox="0 0 1280 834" preserveAspectRatio="xMidYMid slice"
                 xmlns="http://www.w3.org/2000/svg" role="img"
                 aria-label="Fundo com folhas e onda azul-petróleo">

                <defs>
                    <g id="folha">
                        <path d="M0 0 C-42 -60 -38 -140 0 -210 C38 -140 42 -60 0 0Z"/>
                        <path d="M0 -6 L0 -180 M0 -35 L-19 -58 M0 -35 L19 -58 M0 -78 L-24 -104 M0 -78 L24 -104 M0 -120 L-19 -144 M0 -120 L19 -144"
                              fill="none" stroke="#ffffff" stroke-opacity=".32" stroke-width="2" stroke-linecap="round"/>
                    </g>

                    <path id="mini" d="M0 0 C-7 -9 -7 -24 0 -34 C7 -24 7 -9 0 0Z"/>

                    <g id="ramo">
                        <path d="M0 0 C6 -60 -2 -120 10 -190" fill="none" stroke="#e8e0cc" stroke-width="2.5" stroke-linecap="round"/>
                        <g fill="#e8e0cc">
                            <use href="#mini" transform="translate(2 -40) rotate(-40)"/>
                            <use href="#mini" transform="translate(2 -62) rotate(38)"/>
                            <use href="#mini" transform="translate(0 -92) rotate(-38)"/>
                            <use href="#mini" transform="translate(3 -118) rotate(40)"/>
                            <use href="#mini" transform="translate(8 -150) rotate(-34)"/>
                            <use href="#mini" transform="translate(10 -190) rotate(6) scale(1.2)"/>
                        </g>
                    </g>

                    <path id="faixa" d="M720 0 C590 40 520 190 560 300 C590 390 470 470 400 560 C300 640 140 700 40 834 L1280 834 L1280 0Z"/>
                    <path id="bolha" d="M500 834 C560 700 620 640 760 610 C900 580 1100 560 1280 460 L1280 834Z"/>
                </defs>

                <rect width="1280" height="834" fill="#ffffff"/>

                <use href="#faixa" transform="translate(-22 0)" fill="#245062"/>
                <use href="#faixa" fill="#12303e"/>

                <use href="#bolha" transform="translate(0 -16)" fill="#245062"/>
                <use href="#bolha" fill="#ffffff"/>

                <use href="#ramo" transform="translate(700 330) rotate(-28) scale(1.2)"/>
                <use href="#ramo" transform="translate(1000 300) rotate(10) scale(1.1)"/>
                <use href="#ramo" transform="translate(1100 400) rotate(38) scale(1.3)"/>
                <use href="#ramo" transform="translate(400 600) rotate(72) scale(.8)"/>

                <g fill="#17564f">
                    <use href="#folha" transform="translate(480 330) rotate(-78) scale(.9)"/>
                    <use href="#folha" transform="translate(1000 650) rotate(62) scale(2)"/>
                    <use href="#folha" transform="translate(780 640) rotate(-55) scale(2.2)"/>
                    <use href="#folha" transform="translate(780 640) rotate(50) scale(2.2)"/>
                    <use href="#folha" transform="translate(780 640) rotate(-20) scale(2.8)"/>
                    <use href="#folha" transform="translate(780 640) rotate(22) scale(2.6)"/>
                </g>

                <g fill="#2a8574">
                    <use href="#folha" transform="translate(780 640) rotate(-80) scale(2)"/>
                    <use href="#folha" transform="translate(780 640) rotate(82) scale(2.1)"/>
                    <use href="#folha" transform="translate(780 640) rotate(-42) scale(2.4)"/>
                    <use href="#folha" transform="translate(780 640) rotate(42) scale(2.4)"/>
                </g>

                <g fill="#3fa58b">
                    <use href="#folha" transform="translate(780 640) rotate(-12) scale(2.9)"/>
                    <use href="#folha" transform="translate(780 640) rotate(12) scale(2.7)"/>
                    <use href="#folha" transform="translate(780 640) rotate(-62) scale(2)"/>
                </g>

                <g fill="#6fc7a4">
                    <use href="#folha" transform="translate(780 640) rotate(-32) scale(2)"/>
                    <use href="#folha" transform="translate(780 640) rotate(2) scale(2.3)"/>
                    <use href="#folha" transform="translate(780 640) rotate(30) scale(2)"/>
                    <use href="#folha" transform="translate(780 640) rotate(-70) scale(1.5)"/>
                    <use href="#folha" transform="translate(780 640) rotate(70) scale(1.6)"/>
                    <use href="#folha" transform="translate(780 640) rotate(-95) scale(1.3)"/>
                    <use href="#folha" transform="translate(780 640) rotate(95) scale(1.3)"/>
                </g>

                <g fill="#2a8574">
                    <use href="#folha" transform="translate(170 790) rotate(68) scale(1.4)"/>
                    <use href="#folha" transform="translate(300 834) rotate(52) scale(1.3)"/>
                </g>
                <g fill="#6fc7a4">
                    <use href="#folha" transform="translate(380 834) rotate(66) scale(1.1)"/>
                </g>
            </svg>

        </div>
    </section>

    <section id="LoginArea">
        <div id="InputCadastro">
            <input type="text" id="InpuNome">
            <input type="text" id="InputGmail">
            <input type="text" id="InutTelefone">
        </div>
    </section>
</body>
</html>
